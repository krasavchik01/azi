<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АЗИ - Классическая Карточная Игра</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app">
        <!-- Login Screen -->
        <div id="loginScreen" class="screen active">
            <div class="login-container">
                <h1 class="game-title">🃏 АЗИ 🃏</h1>
                <h2 class="subtitle">Классическая карточная игра</h2>
                <p class="description">Цель: первым взять две взятки!</p>
                <input type="text" id="playerName" placeholder="Введите ваше имя" maxlength="20">
                <button id="joinButton" class="btn btn-primary">Войти в Лобби</button>
            </div>
        </div>

        <!-- Waiting Room -->
        <div id="waitingScreen" class="screen">
            <div class="waiting-container">
                <h2>🎲 Комната Ожидания</h2>
                <div class="players-list" id="playersList"></div>
                <div class="waiting-info">
                    <p>Игроков в лобби: <span id="playersCount">0</span>/6</p>
                    <p>Минимум игроков для старта: 2</p>
                </div>
                <button id="startGameBtn" class="btn btn-primary" disabled>Начать Игру</button>
                <p class="hint">Ожидание других игроков...</p>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="gameScreen" class="screen">
            <!-- Game Header -->
            <div class="game-header">
                <div class="game-info">
                    <div class="info-item">
                        <span class="label">Козырь:</span>
                        <span id="trumpDisplay" class="trump-display">—</span>
                    </div>
                    <div class="info-item">
                        <span class="label">Кон:</span>
                        <span id="potDisplay" class="pot-display">0₽</span>
                    </div>
                    <div class="info-item">
                        <span class="label">Ваши деньги:</span>
                        <span id="moneyDisplay" class="money-display">100₽</span>
                    </div>
                    <div class="info-item">
                        <span class="label">Фаза:</span>
                        <span id="phaseDisplay" class="phase-display">—</span>
                    </div>
                </div>
            </div>

            <!-- Players Table -->
            <div class="players-table">
                <div id="otherPlayers" class="other-players"></div>
            </div>

            <!-- Current Trick Display -->
            <div class="trick-area">
                <h3>Текущая Взятка</h3>
                <div id="currentTrick" class="current-trick"></div>
            </div>

            <!-- Action Buttons -->
            <div class="action-panel" id="actionPanel">
                <button id="foldBtn" class="btn btn-danger" style="display:none;">Сбросить Карты</button>
                <button id="passBtn" class="btn btn-secondary" style="display:none;">Пас</button>
                <button id="raiseBtn" class="btn btn-success" style="display:none;">Повысить</button>
                <input type="number" id="raiseAmount" min="5" step="5" value="5" style="display:none;">
                <button id="raznoMastBtn" class="btn btn-special" style="display:none;">Объявить "Разномасть"</button>
            </div>

            <!-- Player Hand -->
            <div class="player-hand-area">
                <h3>Ваши Карты</h3>
                <div id="playerHand" class="player-hand"></div>
            </div>

            <!-- Game Log -->
            <div class="game-log">
                <h4>События игры:</h4>
                <div id="gameLog" class="log-content"></div>
            </div>
        </div>

        <!-- End Screen -->
        <div id="endScreen" class="screen">
            <div class="end-container">
                <h1 id="endResult">Раунд завершен!</h1>
                <p id="endMessage"></p>
                <div id="playerStats"></div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="game.js"></script>
</body>
</html>
