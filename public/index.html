<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мила - Видеозвонок с AI-Психологом 💙</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Auth Screen -->
    <div id="authScreen" class="screen active">
        <div class="auth-container">
            <div class="logo">💙</div>
            <h1>Мила</h1>
            <p class="tagline">Видеозвонок с AI-психологом 24/7</p>

            <!-- Simple Name Entry Form -->
            <div id="registerForm" class="form-container">
                <h2>Как тебя зовут?</h2>
                <input type="text" id="registerName" placeholder="Введи своё имя..." autocomplete="name" autofocus>
                <button id="registerBtn" class="btn btn-primary">Начать разговор 💙</button>
            </div>
        </div>
    </div>

    <!-- Video Call Screen -->
    <div id="chatScreen" class="screen video-call-screen">
        <!-- Video Call Interface -->
        <div class="video-container">
            <!-- AI Avatar Video Area -->
            <div class="avatar-video">
                <div class="avatar-circle" id="avatarCircle">
                    <div class="avatar-image">
                        <div class="avatar-face">
                            <div class="eyes">
                                <div class="eye left">
                                    <div class="pupil"></div>
                                </div>
                                <div class="eye right">
                                    <div class="pupil"></div>
                                </div>
                            </div>
                            <div class="mouth" id="mouth">
                                <div class="smile"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Name Badge -->
                <div class="name-badge">
                    <div class="status-dot"></div>
                    <span>Мила • Онлайн</span>
                </div>

                <!-- Speaking Indicator -->
                <div class="speaking-indicator" id="speakingIndicator">
                    <div class="sound-wave"></div>
                    <div class="sound-wave"></div>
                    <div class="sound-wave"></div>
                    <div class="sound-wave"></div>
                </div>
            </div>

            <!-- Chat Overlay -->
            <div class="chat-overlay" id="chatOverlay">
                <div class="overlay-header">
                    <h3>💬 Чат</h3>
                    <button id="toggleChat" class="icon-btn">✕</button>
                </div>
                <div class="messages-container-overlay" id="messagesContainer">
                </div>
            </div>

            <!-- Transcription Display -->
            <div class="transcription" id="transcription">
                <p id="transcriptionText">Мила слушает...</p>
            </div>
        </div>

        <!-- Control Panel -->
        <div class="control-panel">
            <div class="controls-left">
                <button id="toggleChatBtn" class="control-btn chat-btn" title="Показать чат">
                    💬
                </button>
                <button id="settingsBtn" class="control-btn" title="Настройки">
                    ⚙️
                </button>
            </div>

            <div class="controls-center">
                <!-- Voice Input Button -->
                <button id="voiceBtn" class="control-btn voice-btn" title="Говорить">
                    <span class="icon">🎤</span>
                    <span class="label">Нажми и говори</span>
                </button>

                <!-- Text Input (hidden by default) -->
                <div class="text-input-container" id="textInputContainer" style="display:none;">
                    <input type="text" id="messageInput" placeholder="Или напиши текстом...">
                    <button id="sendBtn" class="send-btn-small">📤</button>
                </div>
            </div>

            <div class="controls-right">
                <button id="toggleTextBtn" class="control-btn" title="Текстовый режим">
                    ⌨️
                </button>
                <button id="toggleVoiceBtn" class="control-btn voice-toggle" title="Звук вкл/выкл">
                    🔊
                </button>
                <button id="logoutBtn" class="control-btn logout-btn" title="Выйти">
                    🚪
                </button>
            </div>
        </div>

        <!-- Session Info -->
        <div class="session-info">
            <div class="session-time" id="sessionTime">00:00</div>
            <div class="session-label">Время сессии</div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="app.js"></script>
</body>
</html>
